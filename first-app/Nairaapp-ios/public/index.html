<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NairaFly</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <div class="phone-shell">
    <!-- SIGN IN / CREATE ACCOUNT GATE -->
    <div id="authView" class="card" style="margin-top: 24px;">
      <div class="card-title">
        <span id="authHeading">Sign In to NairaFly</span>
        <span class="badge-live">NGN Wallet</span>
      </div>
      <p id="authSubtext" style="font-size:13px; color:var(--muted); line-height:1.5; margin-top:0;">
        Sign in with your email to access your wallet, claim rewards, and withdraw Naira.
      </p>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;">
        <button type="button" class="action-btn" id="modeSignInBtn" onclick="setAuthMode('signin')" style="background:var(--emerald); color:#fff; border:none;">
          Sign In
        </button>
        <button type="button" class="action-btn" id="modeSignUpBtn" onclick="setAuthMode('signup')" style="background:var(--bg); color:var(--text); border:1px solid var(--border);">
          Create Account
        </button>
      </div>

      <form id="authForm">
        <div class="input-group hidden" id="authNameGroup">
          <label class="input-label" for="authName">Full Name</label>
          <input type="text" id="authName" placeholder="e.g. Chinedu Okafor" />
        </div>
        <div class="input-group">
          <label class="input-label" for="authEmail">Email Address</label>
          <input type="email" id="authEmail" required placeholder="you@example.com" />
        </div>
        <button type="submit" class="primary-btn" id="authSubmitBtn">Continue to Dashboard</button>
      </form>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainView" class="hidden">
      <!-- HOME TAB -->
      <div id="homeTab">
        <div class="wallet-card">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <div>AVAILABLE NAIRA BALANCE</div>
            <div id="userGreeting" style="font-size:12px; opacity:0.9;"></div>
          </div>
          <div class="balance-amount" id="walletBalance">₦0.00</div>
          <div class="action-grid">
            <button type="button" class="action-btn" id="depositBtn" onclick="openDeposit()">Deposit</button>
            <button type="button" class="action-btn" id="withdrawBtn" onclick="openWithdraw()">Withdraw</button>
            <button type="button" class="action-btn gold" onclick="switchTab('earnTab')">Earn</button>
          </div>
        </div>
        <div id="txList"></div>
      </div>

      <!-- EARN TAB -->
      <div id="earnTab" class="hidden">
        <div class="card">
          <div class="card-title">
            <span>Follow &amp; Earn Tasks</span>
            <span class="badge-live">Live Rewards</span>
          </div>
          <p style="font-size:13px; color:var(--muted); line-height:1.5; margin-top:0;">
            Tap <strong>Open</strong> to follow our social pages, then tap <strong>Claim Reward</strong> to credit your Naira balance.
          </p>
          <div id="earn-tasks-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- DEPOSIT SHEET -->
  <div id="depositSheet" class="sheet-backdrop hidden" onclick="closeSheets(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="card-title">
        <span>Deposit Naira</span>
        <button type="button" onclick="closeAllSheets()" style="background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div class="input-group">
        <label class="input-label" for="depositEmail">Email Address</label>
        <input type="email" id="depositEmail" placeholder="you@example.com" />
      </div>
      <div class="input-group">
        <label class="input-label" for="depositAmount">Amount (NGN)</label>
        <input type="number" id="depositAmount" min="100" step="100" placeholder="1000" />
      </div>
      <button type="button" class="primary-btn" id="submitDepositBtn" onclick="submitDeposit()">Continue to Deposit</button>
    </div>
  </div>

  <!-- WITHDRAW SHEET -->
  <div id="withdrawSheet" class="sheet-backdrop hidden" onclick="closeSheets(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="card-title">
        <span>Withdraw Naira</span>
        <button type="button" onclick="closeAllSheets()" style="background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div class="input-group">
        <label class="input-label" for="withdrawEmail">Email Address</label>
        <input type="email" id="withdrawEmail" placeholder="you@example.com" />
      </div>
      <div class="input-group">
        <label class="input-label" for="withdrawBankCode">Bank</label>
        <select id="withdrawBankCode" onchange="verifyWithdrawAccount()">
          <option value="">Select bank</option>
          <option value="044">Access Bank</option>
          <option value="058">GTBank</option>
          <option value="033">UBA</option>
          <option value="057">Zenith Bank</option>
          <option value="011">First Bank</option>
          <option value="070">Fidelity Bank</option>
          <option value="50211">Kuda Bank</option>
          <option value="999992">OPay Digital Services</option>
          <option value="999991">PalmPay</option>
          <option value="50515">Moniepoint MFB</option>
        </select>
      </div>
      <div class="input-group">
        <label class="input-label" for="withdrawAccountNumber">
          <span>Account Number</span>
          <span id="withdrawDigitCount">0/10</span>
        </label>
        <input
          type="text"
          id="withdrawAccountNumber"
          maxlength="10"
          inputmode="numeric"
          placeholder="0123456789"
          oninput="handleWithdrawAccountInput()"
        />
      </div>
      <div id="withdrawAccountStatus" class="hidden"></div>
      <div class="input-group">
        <label class="input-label" for="withdrawAmount">Amount (NGN)</label>
        <input type="number" id="withdrawAmount" min="100" step="100" placeholder="1000" />
      </div>
      <button type="button" class="primary-btn" id="submitWithdrawBtn" onclick="submitWithdraw()">Request Withdrawal</button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav" aria-label="Bottom Navigation">
    <button type="button" class="nav-btn active" id="navHome" onclick="switchTab('homeTab')">
      <span>Home</span>
    </button>
    <button type="button" class="nav-btn" id="navEarn" onclick="switchTab('earnTab')">
      <span>Earn</span>
    </button>
    <button type="button" class="nav-btn" id="navDeposit" onclick="openDeposit()">
      <span>Deposit</span>
    </button>
    <button type="button" class="nav-btn" id="navWithdraw" onclick="openWithdraw()">
      <span>Withdraw</span>
    </button>
  </nav>

  <script src="./js/app.js"></script>
</body>
</html>
