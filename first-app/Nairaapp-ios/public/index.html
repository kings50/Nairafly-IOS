<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NairaFly</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="phone-shell">
    <div id="mainView">
      <!-- HOME TAB -->
      <div id="homeTab">
        <div class="wallet-card">
          <div>AVAILABLE NAIRA BALANCE</div>
          <div class="balance-amount" id="walletBalance">₦0.00</div>
          <div class="action-grid">
            <button type="button" class="action-btn" id="depositBtn" onclick="openDeposit()">Deposit</button>
            <button type="button" class="action-btn" id="withdrawBtn" onclick="openWithdraw()">Withdraw</button>
            <button type="button" class="action-btn gold" onclick="switchTab('earnTab')">Earn</button>
          </div>
        </div>
        <div id="txList"></div>
      </div>

      <!-- EARN TAB -->
      <div id="earnTab" class="hidden">
        <div class="card">
          <div class="card-title">
            <span>CPA &amp; Partner Offers</span>
            <span class="badge-live">Live Monetization</span>
          </div>
          <p style="font-size:13px; color:var(--muted); line-height:1.5; margin-top:0;">
            Connect your CPALead, AdGate Media, or AyeT-Studios Offerwall URL here so completed tasks credit automatically.
          </p>
          <div id="earn-tasks-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- DEPOSIT SHEET -->
  <div id="depositSheet" class="sheet-backdrop hidden" onclick="closeSheets(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="card-title">
        <span>Deposit Naira</span>
        <button type="button" onclick="closeAllSheets()" style="background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div class="input-group">
        <label class="input-label" for="depositEmail">Email Address</label>
        <input type="email" id="depositEmail" placeholder="you@example.com" />
      </div>
      <div class="input-group">
        <label class="input-label" for="depositAmount">Amount (NGN)</label>
        <input type="number" id="depositAmount" min="100" step="100" placeholder="1000" />
      </div>
      <button type="button" class="primary-btn" id="submitDepositBtn" onclick="submitDeposit()">Continue to Deposit</button>
    </div>
  </div>

  <!-- WITHDRAW SHEET -->
  <div id="withdrawSheet" class="sheet-backdrop hidden" onclick="closeSheets(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="card-title">
        <span>Withdraw Naira</span>
        <button type="button" onclick="closeAllSheets()" style="background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div class="input-group">
        <label class="input-label" for="withdrawEmail">Email Address</label>
        <input type="email" id="withdrawEmail" placeholder="you@example.com" />
      </div>
      <div class="input-group">
        <label class="input-label" for="withdrawBankCode">Bank</label>
        <select id="withdrawBankCode" onchange="verifyWithdrawAccount()">
          <option value="">Select bank</option>
          <option value="044">Access Bank</option>
          <option value="058">GTBank</option>
          <option value="033">UBA</option>
          <option value="057">Zenith Bank</option>
          <option value="011">First Bank</option>
          <option value="070">Fidelity Bank</option>
          <option value="50211">Kuda Bank</option>
          <option value="999992">OPay Digital Services</option>
          <option value="999991">PalmPay</option>
          <option value="50515">Moniepoint MFB</option>
        </select>
      </div>
      <div class="input-group">
        <label class="input-label" for="withdrawAccountNumber">
          <span>Account Number</span>
          <span id="withdrawDigitCount">0/10</span>
        </label>
        <input
          type="text"
          id="withdrawAccountNumber"
          maxlength="10"
          inputmode="numeric"
          placeholder="0123456789"
          oninput="handleWithdrawAccountInput()"
        />
      </div>
      <div id="withdrawAccountStatus" class="hidden"></div>
      <div class="input-group">
        <label class="input-label" for="withdrawAmount">Amount (NGN)</label>
        <input type="number" id="withdrawAmount" min="100" step="100" placeholder="1000" />
      </div>
      <button type="button" class="primary-btn" id="submitWithdrawBtn" onclick="submitWithdraw()">Request Withdrawal</button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav" aria-label="Bottom Navigation">
    <button type="button" class="nav-btn active" id="navHome" onclick="switchTab('homeTab')">
      <span>Home</span>
    </button>
    <button type="button" class="nav-btn" id="navEarn" onclick="switchTab('earnTab')">
      <span>Earn</span>
    </button>
    <button type="button" class="nav-btn" id="navDeposit" onclick="openDeposit()">
      <span>Deposit</span>
    </button>
    <button type="button" class="nav-btn" id="navWithdraw" onclick="openWithdraw()">
      <span>Withdraw</span>
    </button>
  </nav>

  <script>
    let resolvedAccountName = '';

    function getCurrentUserEmail() {
      if (window.state && window.state.email) return window.state.email;
      if (window.state && window.state.user && window.state.user.email) return window.state.user.email;
      if (window.currentUser && window.currentUser.email) return window.currentUser.email;
      const emailInput = document.querySelector('input[type="email"]');
      if (emailInput && emailInput.value) return emailInput.value.trim();
      return localStorage.getItem('userEmail') || localStorage.getItem('nairafly_email') || '';
    }

    function switchTab(tabName) {
      const homeTab = document.getElementById('homeTab');
      const earnTab = document.getElementById('earnTab');
      const navHome = document.getElementById('navHome');
      const navEarn = document.getElementById('navEarn');

      if (homeTab) homeTab.classList.toggle('hidden', tabName !== 'homeTab');
      if (earnTab) earnTab.classList.toggle('hidden', tabName !== 'earnTab');
      if (navHome) navHome.classList.toggle('active', tabName === 'homeTab');
      if (navEarn) navEarn.classList.toggle('active', tabName === 'earnTab');

      if (tabName === 'earnTab') {
        loadEarnTasks();
      }
    }

    function openDeposit() {
      const email = getCurrentUserEmail();
      const input = document.getElementById('depositEmail');
      if (input && email) input.value = email;
      document.getElementById('depositSheet')?.classList.remove('hidden');
    }

    function openWithdraw() {
      const email = getCurrentUserEmail();
      const input = document.getElementById('withdrawEmail');
      if (input && email) input.value = email;
      document.getElementById('withdrawSheet')?.classList.remove('hidden');
    }

    function closeAllSheets() {
      document.getElementById('depositSheet')?.classList.add('hidden');
      document.getElementById('withdrawSheet')?.classList.add('hidden');
    }

    function closeSheets(event) {
      if (event.target.classList.contains('sheet-backdrop')) {
        closeAllSheets();
      }
    }

    function handleWithdrawAccountInput() {
      const accInput = document.getElementById('withdrawAccountNumber');
      const countEl = document.getElementById('withdrawDigitCount');
      if (!accInput) return;
      accInput.value = accInput.value.replace(/\D/g, '').slice(0, 10);
      if (countEl) countEl.textContent = `${accInput.value.length}/10`;
      verifyWithdrawAccount();
    }

    async function verifyWithdrawAccount() {
      const bankCode = document.getElementById('withdrawBankCode')?.value || '';
      const accountNumber = (document.getElementById('withdrawAccountNumber')?.value || '').trim();
      const statusEl = document.getElementById('withdrawAccountStatus');
      resolvedAccountName = '';

      if (!statusEl) return;

      if (accountNumber.length < 10 || !bankCode) {
        statusEl.className = 'hidden';
        statusEl.textContent = '';
        return;
      }

      statusEl.className = 'verified-box';
      statusEl.textContent = 'Verifying 10-digit account...';

      try {
        const params = new URLSearchParams({
          account_number: accountNumber,
          bank_code: bankCode
        });
        const res = await fetch(`/api/resolve-account?${params.toString()}`);
        const data = await res.json();

        const accountName = data.account_name || data.data?.account_name || '';
        if (res.ok && accountName) {
          resolvedAccountName = accountName;
          statusEl.className = 'verified-box';
          statusEl.innerHTML = `✓ Verified Account: <strong>${accountName}</strong>`;
        } else {
          statusEl.className = 'error-box';
          statusEl.textContent = data.message || 'Could not verify account number.';
        }
      } catch (err) {
        statusEl.className = 'error-box';
        statusEl.textContent = 'Error verifying account details.';
      }
    }

    async function submitDeposit() {
      const email = (document.getElementById('depositEmail')?.value || getCurrentUserEmail() || '').trim();
      const amountNgn = Number(document.getElementById('depositAmount')?.value || 0);
      if (!email || !amountNgn || amountNgn <= 0) {
        alert('Enter a valid email and deposit amount.');
        return;
      }

      const btn = document.getElementById('submitDepositBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Processing...';
      }

      try {
        const res = await fetch('/api/init-deposit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, amount_ngn: amountNgn, amount_kobo: Math.round(amountNgn * 100) })
        });
        const data = await res.json();
        if (data.authorization_url) {
          window.location.href = data.authorization_url;
          return;
        }
        alert(data.message || 'Deposit request sent.');
        closeAllSheets();
      } catch (err) {
        alert('Could not start deposit right now.');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Continue to Deposit';
        }
      }
    }

    async function submitWithdraw() {
      const email = (document.getElementById('withdrawEmail')?.value || getCurrentUserEmail() || '').trim();
      const bankSelect = document.getElementById('withdrawBankCode');
      const bankCode = bankSelect?.value || '';
      const bankName = bankSelect && bankSelect.selectedIndex > 0 ? bankSelect.options[bankSelect.selectedIndex].text : '';
      const accountNumber = (document.getElementById('withdrawAccountNumber')?.value || '').trim();
      const amountNgn = Number(document.getElementById('withdrawAmount')?.value || 0);

      if (!email || !bankCode || accountNumber.length !== 10 || !amountNgn || amountNgn <= 0) {
        alert('Please enter your email, bank, 10-digit account number, and valid amount.');
        return;
      }

      if (!resolvedAccountName) {
        await verifyWithdrawAccount();
      }

      const btn = document.getElementById('submitWithdrawBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Submitting...';
      }

      try {
        const res = await fetch('/api/wallet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'withdraw',
            email,
            bank_code: bankCode,
            bank_name: bankName,
            account_number: accountNumber,
            account_name: resolvedAccountName,
            amount_ngn: amountNgn,
            amount_kobo: Math.round(amountNgn * 100)
          })
        });
        const data = await res.json();
        alert(data.message || (res.ok ? 'Withdrawal request submitted.' : 'Could not process withdrawal.'));
        if (res.ok) {
          resolvedAccountName = '';
          closeAllSheets();
        }
      } catch (err) {
        alert('Could not process withdrawal right now.');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Request Withdrawal';
        }
      }
    }

    async function loadEarnTasks(userEmail) {
      const container = document.getElementById('earn-tasks-list');
      if (!container) return;

      try {
        const res = await fetch('/api/tasks');
        const data = await res.json();

        if (!data.status || !Array.isArray(data.tasks)) {
          container.innerHTML = '<p style="font-size:13px; color:var(--muted);">Could not load tasks right now.</p>';
          return;
        }

        container.innerHTML = '';

        data.tasks.forEach((task) => {
          const card = document.createElement('div');
          card.className = 'task-card';
          card.innerHTML = `
            <div>
              <div class="task-title">${task.title}</div>
              <div class="task-reward">+₦${Number(task.reward_ngn).toFixed(2)}</div>
            </div>
            <div class="task-actions">
              <a href="${task.url}" target="_blank" rel="noopener noreferrer">Open</a>
              <button type="button" data-task-id="${task.id}">Claim Reward</button>
            </div>
          `;

          const claimBtn = card.querySelector('button');
          claimBtn.addEventListener('click', async () => {
            const activeEmail = (userEmail || getCurrentUserEmail() || '').trim();
            if (!activeEmail) {
              alert('Please sign in or enter your email first.');
              return;
            }

            claimBtn.disabled = true;
            claimBtn.textContent = 'Claiming...';

            try {
              const claimRes = await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  email: activeEmail,
                  task_id: task.id
                })
              });
              const claimData = await claimRes.json();

              if (!claimRes.ok || !claimData.status) {
                alert(claimData.message || 'Could not claim task.');
                claimBtn.disabled = false;
                claimBtn.textContent = 'Claim Reward';
                return;
              }

              claimBtn.textContent = 'Claimed';
              const balanceEl = document.getElementById('walletBalance');
              if (balanceEl && typeof claimData.balance_kobo === 'number') {
                balanceEl.textContent = `₦${(claimData.balance_kobo / 100).toFixed(2)}`;
              }
              if (typeof window.renderDashboard === 'function') {
                window.renderDashboard();
              }
            } catch (err) {
              alert('Network error while claiming task.');
              claimBtn.disabled = false;
              claimBtn.textContent = 'Claim Reward';
            }
          });

          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p style="font-size:13px; color:var(--muted);">Error loading tasks.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadEarnTasks();
    });
  </script>
</body>
</html>
